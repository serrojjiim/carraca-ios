name: Carraca
options:
  bundleIdPrefix: com.carraca
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
targets:
  Carraca:
    type: application
    platform: iOS
    sources:
      - Carraca
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carraca.smarter
        PRODUCT_NAME: Carraca
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        # FLAVOR (el flujo Ad Hoc sustituye esta linea por la version privada)
    info:
      path: Carraca/Info.plist
      properties:
        CFBundleDisplayName: Carraca
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBg
          UIImageName: Logo
          UIImageRespectsSafeAreaInsets: true
        UIBackgroundModes: [audio]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.carraca.smarter.login
            CFBundleURLSchemes: [carraca]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
