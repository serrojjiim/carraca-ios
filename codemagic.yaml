# Compilacion en la nube (Codemagic, Mac M2) -> IPA Ad Hoc firmada.
# Requisitos en Codemagic (una vez):
#   - Integracion App Store Connect llamada "Carraca ASC" (clave API de tu cuenta Apple).
#   - Certificado "Apple Distribution" en Code signing identities (se puede generar alli).
workflows:
  ios-adhoc:
    name: Carraca iOS (Ad Hoc)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Carraca ASC
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.carraca.smarter
      xcode: latest
      cocoapods: default
    scripts:
      - name: Numero de build
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/" project.yml
          grep CURRENT_PROJECT_VERSION project.yml
      - name: Generar proyecto Xcode
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Instalar pods (VLC)
        script: pod install --repo-update
      - name: Aplicar perfiles de firma
        script: xcode-project use-profiles
      - name: Compilar IPA
        script: xcode-project build-ipa --workspace Carraca.xcworkspace --scheme Carraca
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
