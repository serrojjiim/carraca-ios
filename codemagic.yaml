# Compilacion en la nube (Codemagic, Mac M2) -> IPA Ad Hoc firmada.
# Requisitos en Codemagic (una vez):
#   - Integracion App Store Connect llamada "Carraca ASC" (clave API de tu cuenta Apple).
#   - Certificado "Apple Distribution" en Code signing identities (se puede generar alli).
workflows:
  ios-adhoc:
    name: Carraca iOS (Ad Hoc)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Carraca ASC
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.carraca.smarter
      xcode: latest
      cocoapods: default
    scripts:
      - name: Numero de build
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/" project.yml
          grep CURRENT_PROJECT_VERSION project.yml
      - name: Generar proyecto Xcode
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Instalar pods (VLC)
        script: pod install --repo-update
      - name: Aplicar perfiles de firma
        script: xcode-project use-profiles
      - name: Compilar IPA
        script: xcode-project build-ipa --workspace Carraca.xcworkspace --scheme Carraca
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  # Compila SIN firmar (no necesita cuenta de Apple): sirve para detectar errores
  # de codigo. Genera Carraca-sin-firmar.ipa (no instalable tal cual en un iPhone).
  ios-check:
    name: Comprobar compilacion (sin firmar)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generar proyecto Xcode
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Instalar pods (VLC)
        script: pod install --repo-update
      - name: Compilar sin firma
        script: |
          set -o pipefail
          xcodebuild -workspace Carraca.xcworkspace -scheme Carraca -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            | xcpretty || (echo "---- ERRORES ----"; grep -E "error:" build/xcodebuild.log 2>/dev/null; exit 1)
      - name: Empaquetar IPA sin firmar
        script: |
          mkdir -p build/out/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/Carraca.app build/out/Payload/
          cd build/out && zip -qry Carraca-sin-firmar.ipa Payload
    artifacts:
      - build/out/*.ipa

  # Compilacion para SIMULADOR (sin firma): se sube a appetize.io para probar
  # la app desde el navegador en Windows. Artefacto: Carraca-simulador.zip
  ios-simulator:
    name: Simulador (para Appetize)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generar proyecto Xcode
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Instalar pods (VLC)
        script: pod install --repo-update
      - name: Compilar para simulador
        script: |
          set -o pipefail
          xcodebuild -workspace Carraca.xcworkspace -scheme Carraca -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO build | xcpretty
      - name: Empaquetar
        script: |
          mkdir -p build/out
          cd build/dd/Build/Products/Debug-iphonesimulator
          zip -qry ../../../../out/Carraca-simulador.zip Carraca.app
    artifacts:
      - build/out/*.zip
