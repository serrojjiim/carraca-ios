# Compilacion en la nube (Codemagic, Mac M2). Cuatro flujos:
#   ios-testflight : version GENERICA -> TestFlight (grupo "Amigos"). Firma automatica.
#   ios-check      : compila sin firmar (detectar errores, sin cuenta de Apple)
#   ios-simulator  : build para simulador (probar en appetize.io)
#   ios-adhoc      : version PRIVADA (servidor Carraca, Deportes...) firmada Ad Hoc
#
# Requisitos en Codemagic para firmar:
#   - Integracion App Store Connect llamada "sergio" (clave API de la cuenta de Apple).
#   - Grupo de variables "carraca_firma" con CERTIFICATE_PRIVATE_KEY (clave RSA del certificado).

definitions:
  scripts:
    - &xcodegen
      name: Generar proyecto Xcode
      script: |
        brew install xcodegen
        xcodegen generate
    - &pods
      name: Instalar pods (VLC)
      script: pod install --repo-update

workflows:
  # Prueba rapida de la clave API: registra el identificador de la app (Bundle ID)
  # y lista lo que hay en la cuenta. No compila nada.
  ios-registrar:
    name: Registrar identificador (prueba de la clave API)
    max_build_duration: 15
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: sergio
    scripts:
      - name: Identificadores existentes
        script: app-store-connect bundle-ids list --platform IOS || true
      - name: Registrar com.carraca.smarter
        script: |
          if app-store-connect bundle-ids list --bundle-id-identifier com.carraca.smarter --strict-match-identifier | grep -q com.carraca.smarter; then
            echo "Ya existe com.carraca.smarter"
          else
            app-store-connect bundle-ids create com.carraca.smarter --name "Carraca" --platform IOS
          fi
      - name: Comprobar
        script: app-store-connect bundle-ids list --bundle-id-identifier com.carraca.smarter

  ios-testflight:
    name: TestFlight (version generica)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: sergio
    environment:
      groups:
        - carraca_firma
      xcode: latest
      cocoapods: default
    scripts:
      - name: Numero de build
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/" project.yml
      - *xcodegen
      - *pods
      - name: Firma (crea App ID, certificado y perfil si no existen)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.carraca.smarter" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Compilar IPA
        script: xcode-project build-ipa --workspace Carraca.xcworkspace --scheme Carraca
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Amigos

  ios-check:
    name: Comprobar compilacion (sin firmar)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - *xcodegen
      - *pods
      - name: Compilar sin firma
        script: |
          set -o pipefail
          xcodebuild -workspace Carraca.xcworkspace -scheme Carraca -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | xcpretty
      - name: Empaquetar IPA sin firmar
        script: |
          mkdir -p build/out/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/Carraca.app build/out/Payload/
          cd build/out && zip -qry Carraca-sin-firmar.ipa Payload
    artifacts:
      - build/out/*.ipa

  ios-simulator:
    name: Simulador (para Appetize)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - *xcodegen
      - *pods
      - name: Compilar para simulador
        script: |
          set -o pipefail
          xcodebuild -workspace Carraca.xcworkspace -scheme Carraca -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO build | xcpretty
      - name: Empaquetar
        script: |
          mkdir -p build/out
          cd build/dd/Build/Products/Debug-iphonesimulator
          zip -qry ../../../../out/Carraca-simulador.zip Carraca.app
    artifacts:
      - build/out/*.zip

  ios-adhoc:
    name: Ad Hoc (version privada)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: sergio
    environment:
      groups:
        - carraca_firma
      xcode: latest
      cocoapods: default
    scripts:
      - name: Version privada + numero de build
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/" project.yml
          sed -i '' 's/^        # FLAVOR.*$/        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CARRACA_PRIVATE"/' project.yml
          grep -n "CARRACA_PRIVATE\|CURRENT_PROJECT_VERSION" project.yml
      - *xcodegen
      - *pods
      - name: Firma Ad Hoc (incluye los dispositivos registrados en Apple)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.carraca.smarter" --type IOS_APP_ADHOC --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Compilar IPA
        script: xcode-project build-ipa --workspace Carraca.xcworkspace --scheme Carraca
    artifacts:
      - build/ios/ipa/*.ipa
